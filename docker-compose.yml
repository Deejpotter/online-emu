services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      LIBRARY_SOURCE: r2
      SAVE_STORAGE: r2
      PROFILE_STORAGE: postgres
      DATABASE_URL: postgres://onlineemu:${POSTGRES_PASSWORD}@db:5432/onlineemu
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-deejpotter}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlineemu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: onlineemu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlineemu -d onlineemu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
